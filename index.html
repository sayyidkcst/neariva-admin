<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b3f3b">
<title>Nearby admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f5;--sf:#fff;--ink:#10201d;--mut:#5b706b;--line:#d9e3e0;--acc:#0f766e;--acc-ink:#fff;--rail:#0b3f3b;--rail-ink:#cfe8e3;--rail-on:#145a54;--bad:#b91c1c;--bad-bg:#fdecec;--bar:#8fd0c6;--hov:#eef4f2}
@media (prefers-color-scheme:dark){:root{--bg:#0c1715;--sf:#13221f;--ink:#e5f0ed;--mut:#8fa8a2;--line:#243b36;--acc:#2dd4bf;--acc-ink:#04201c;--rail:#08211f;--rail-ink:#b8d8d2;--rail-on:#10413b;--bad:#f87171;--bad-bg:#2a1616;--bar:#1f5c55;--hov:#182b27}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
a{color:var(--acc)}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.lcard h1{margin:0 0 4px;font-size:24px;font-weight:600}
.lcard p{margin:0 0 20px;color:var(--mut)}
.field{display:block;margin-top:14px;font-size:14px;color:var(--mut)}
.field input,.field select{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.err{min-height:20px;margin-top:12px;font-size:14px;color:var(--bad)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid transparent;border-radius:10px;background:var(--acc);color:var(--acc-ink);font-weight:500;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.btn.full{width:100%;margin-top:6px}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.solid-danger{background:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:8px}

/* ---------- shell ---------- */
#app{min-height:100dvh}
.rail{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--rail);color:var(--rail-ink)}
.brand{flex:1;font-weight:600;font-size:17px;color:#fff;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--rail-ink)}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who button{background:transparent;border:1px solid color-mix(in srgb,var(--rail-ink) 40%,transparent);color:var(--rail-ink);border-radius:8px;padding:4px 10px;cursor:pointer}
#nav{order:3;width:100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
#nav button{flex:0 0 auto;padding:7px 14px;border:0;border-radius:999px;background:transparent;color:var(--rail-ink);cursor:pointer;font-weight:500}
#nav button[aria-current="page"]{background:var(--rail-on);color:#fff}
main{padding:18px 14px calc(40px + env(safe-area-inset-bottom,0px));max-width:1120px}
@media (min-width:860px){
  #app{display:grid;grid-template-columns:232px 1fr}
  .rail{height:100dvh;flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:24px 14px;gap:18px}
  .brand{flex:0 0 auto;padding:0 8px}
  #nav{order:0;flex-direction:column;overflow:visible;gap:4px}
  #nav button{text-align:left;border-radius:10px;padding:10px 12px}
  .who{margin-top:auto;justify-content:space-between;padding:0 8px}
  main{padding:30px 34px 60px}
}

/* ---------- content ---------- */
h1.pt{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
.sub{margin:4px 0 18px;color:var(--mut)}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:12px}
.pad{padding:18px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar input,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sf);color:var(--ink);min-width:0}
.bar input[type=search]{flex:1 1 200px}
.bar .grow{flex:1}
.count{color:var(--mut);font-size:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{padding:10px 14px;text-align:left;font-weight:500;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hov)}
td.act{text-align:right;white-space:nowrap}
td.act>*{margin-left:6px}
.nm{display:flex;align-items:center;gap:12px;min-width:0}
.nm img,.nm .ph{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:var(--hov)}
.nm .ph{display:grid;place-items:center;font-size:18px}
.nm b{display:block;font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;color:var(--mut);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;background:color-mix(in srgb,var(--acc) 12%,transparent);white-space:nowrap}
.stars{color:#d97706;letter-spacing:1px;white-space:nowrap}
.cm{max-width:340px;white-space:pre-wrap;word-break:break-word}
.empty{padding:34px 18px;text-align:center;color:var(--mut)}
.more{padding:14px;text-align:center;border-top:1px solid var(--line)}

/* overview */
.ov{display:grid;gap:18px}
@media (min-width:980px){.ov{grid-template-columns:1fr 1fr}}
.tot{display:flex;flex-wrap:wrap;gap:8px 34px;margin:0}
.tot div{min-width:110px}
.tot dt{color:var(--mut);font-size:14px}
.tot dd{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
h2.st{margin:0 0 12px;font-size:16px;font-weight:600}
.bars{display:grid;gap:9px}
.br{display:grid;grid-template-columns:128px 1fr 34px;gap:10px;align-items:center;font-size:14px}
.br span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br i{display:block;height:10px;border-radius:5px;background:var(--bar);min-width:3px}
.br b{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.ll{list-style:none;margin:0;padding:0}
.ll li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.ll li:last-child{border-bottom:0}
.ll span{color:var(--mut);font-size:13px;white-space:nowrap}
.ll em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fg .full{grid-column:1/-1}.fg .field{margin-top:12px}
#edlg{width:min(94vw,480px);max-height:92dvh;overflow-y:auto}
/* cache */
.warn{margin:0 0 14px;padding:12px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:14px}
.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{margin:10px 0 0;color:var(--mut);font-size:14px}

/* dialog + toast */
dialog{width:min(92vw,400px);padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--sf);color:var(--ink);box-shadow:0 24px 60px #0005}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 8px;font-size:18px;font-weight:600}
dialog p{margin:0 0 18px;color:var(--mut)}
dialog .row2{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="login" class="login">
  <form class="lcard" id="lf">
    <h1>Nearby admin</h1>
    <p>Sign in with your admin account.</p>
    <label class="field">Mobile number<input id="mob" inputmode="numeric" autocomplete="username" placeholder="Digits only"></label>
    <label class="field">Password<input id="pw" type="password" autocomplete="current-password"></label>
    <div class="err" id="lerr" role="alert"></div>
    <button class="btn full" id="lgo" type="submit">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="rail">
    <div class="brand">Nearby admin<small>KCST Media Technology</small></div>
    <div class="who"><span id="who"></span><button id="out" type="button">Sign out</button></div>
    <nav id="nav" aria-label="Sections">
      <button data-v="overview">Overview</button>
      <button data-v="places">Places</button>
      <button data-v="reviews">Reviews</button>
      <button data-v="cache">Map cache</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <h3 id="dt"></h3>
  <p id="dm"></p>
  <div class="row2"><button class="btn ghost" id="dno" type="button">Cancel</button><button class="btn solid-danger" id="dok" type="button"></button></div>
</dialog>
<dialog id="edlg">
  <form id="ef">
    <h3>Edit place</h3>
    <div class="fg">
      <label class="field full">Category<select id="ecat"></select></label>
      <label class="field full">Name<input id="ename" maxlength="120" required></label>
      <label class="field">Phone<input id="ephone" type="tel" maxlength="30"></label>
      <label class="field">Details<input id="edetail" maxlength="200"></label>
      <label class="field full">Address<input id="eaddr" maxlength="300"></label>
      <label class="field">Latitude<input id="elat" inputmode="decimal"></label>
      <label class="field">Longitude<input id="elon" inputmode="decimal"></label>
    </div>
    <div class="field full" style="margin-top:14px">Photo
      <div class="row2" style="margin-top:6px"><img id="eprev" alt="" hidden style="width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--hov)"><label class="btn ghost sm" for="efile">Change photo</label><input id="efile" type="file" accept="image/*" hidden><button class="btn danger sm" id="erm" type="button" hidden>Remove photo</button></div>
    </div>
    <div class="err" id="eerr" role="alert"></div>
    <div class="row2" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost" id="eno" type="button">Cancel</button><button class="btn" id="esave" type="submit">Save changes</button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>

<script>
const URL_="https://jfkocwuaerxnmxuhlyok.supabase.co",KEY="sb_publishable_C6jmy7c8Q60PClOqawXtJg_RNbvR5B3";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS={hospital:["🏥","Hospital"],ambulance:["🚑","Ambulance"],pharmacy:["💊","Pharmacy"],police:["🚓","Police"],fire:["🚒","Fire station"],shop:["🛍️","Shop"],transport:["🚕","Vehicles"],bus:["🚌","Bus time"],fuel:["⛽","Fuel"],bank:["🏦","Banks and ATMs"],food:["🍽️","Food"],other:["📌","Other"]};
const catLabel=k=>CATS[k]?CATS[k][0]+" "+CATS[k][1]:esc(k||"Unknown");
const fmtDate=d=>d?new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"";
const stars=n=>"★".repeat(n)+"☆".repeat(Math.max(0,5-n));

let S=null,view="overview",D={places:[],reviews:[],nPlaces:0,nReviews:0,nOsm:null};
const F={q:"",cat:"",lim:100},R={q:"",lim:100};

/* ---------- api ---------- */
const H={apikey:KEY,"Content-Type":"application/json"};
async function rpc(fn,body){
  const r=await fetch(`${URL_}/rest/v1/rpc/${fn}`,{method:"POST",headers:H,body:JSON.stringify(body)});
  if(!r.ok){let m="Request failed";try{m=(await r.json()).message||m}catch(e){}throw new Error(m)}
  return r.json()}
const adm=(fn,extra)=>rpc(fn,Object.assign({p_mobile:S.mobile,p_hash:S.hash},extra||{}));
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function get(path){
  try{const r=await fetch(`${URL_}/rest/v1/${path}`,{headers:{apikey:KEY}});return r.ok?await r.json():null}catch(e){return null}}
async function count(table,filter){
  try{
    const r=await fetch(`${URL_}/rest/v1/${table}?select=*${filter||""}`,{method:"HEAD",headers:{apikey:KEY,Prefer:"count=exact",Range:"0-0"}});
    if(!r.ok)return null;
    const n=(r.headers.get("content-range")||"").split("/")[1];
    return n&&n!=="*"?+n:0
  }catch(e){return null}}
function toast(t,bad){const x=$("#toast");x.textContent=t;x.className="on"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>x.className="",2800)}

/* ---------- sign in ---------- */
function friendly(m){return /admin_check|schema cache|Could not find/i.test(m)?"Admin functions are not set up in Supabase yet. Run the admin SQL first.":m}
$("#lf").onsubmit=async e=>{
  e.preventDefault();
  const mob=$("#mob").value.replace(/[\s\-+()]/g,""),pw=$("#pw").value,err=$("#lerr"),b=$("#lgo");err.textContent="";
  if(!/^\d{7,15}$/.test(mob)){err.textContent="Enter your mobile number, digits only";return}
  if(!pw){err.textContent="Enter your password";return}
  b.disabled=true;
  try{
    const h=await sha("swipe:"+mob+":"+pw);
    const r=await rpc("login",{p_mobile:mob,p_hash:h});
    if(r.error)throw new Error(r.error);
    const c=await rpc("admin_check",{p_mobile:mob,p_hash:h});
    if(c&&c.error)throw new Error(c.error);
    S={mobile:mob,hash:h};
    try{sessionStorage.setItem("nearby_admin",JSON.stringify(S))}catch(x){}
    $("#pw").value="";enter()
  }catch(x){err.textContent=friendly(x.message)}
  b.disabled=false};
$("#out").onclick=()=>{try{sessionStorage.removeItem("nearby_admin")}catch(e){}S=null;$("#app").hidden=true;$("#login").hidden=false};
function enter(){
  $("#login").hidden=true;$("#app").hidden=false;$("#who").textContent="+"+S.mobile;
  show("overview");loadAll()}
(async()=>{
  try{
    const s=JSON.parse(sessionStorage.getItem("nearby_admin")||"null");
    if(s&&s.mobile&&s.hash){S=s;const c=await adm("admin_check");if(!c.error){enter();return}}
  }catch(e){}
  S=null})();

/* ---------- navigation ---------- */
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};
function show(v){
  view=v;
  document.querySelectorAll("#nav button").forEach(b=>{if(b.dataset.v===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  ({overview:rOverview,places:rPlaces,reviews:rReviews,cache:rCache})[v]();
  window.scrollTo(0,0)}

async function loadAll(){
  const [pl,rv,np,nr,no]=await Promise.all([
    get("places?select=*&order=created_at.desc&limit=2000"),
    get("place_reviews?select=*&order=created_at.desc&limit=2000"),
    count("places"),count("place_reviews"),count("osm_places")]);
  D.places=pl||[];D.reviews=rv||[];D.nPlaces=np==null?D.places.length:np;D.nReviews=nr==null?D.reviews.length:nr;D.nOsm=no;
  show(view)}

/* ---------- overview ---------- */
function rOverview(){
  const by={};D.places.forEach(p=>by[p.category]=(by[p.category]||0)+1);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1;
  const byId={};D.places.forEach(p=>byId[String(p.id)]=p);
  $("#main").innerHTML=`
    <h1 class="pt">Overview</h1><p class="sub">What people have added to Nearby.</p>
    <div class="ov">
      <section class="panel pad">
        <dl class="tot">
          <div><dt>Places added</dt><dd>${D.nPlaces}</dd></div>
          <div><dt>Reviews</dt><dd>${D.nReviews}</dd></div>
          <div><dt>Saved map places</dt><dd>${D.nOsm==null?"–":D.nOsm}</dd></div>
        </dl>
      </section>
      <section class="panel pad">
        <h2 class="st">Places by category</h2>
        ${rows.length?`<div class="bars">${rows.map(([k,n])=>`<div class="br"><span>${catLabel(k)}</span><i style="width:${Math.max(2,Math.round(n/max*100))}%"></i><b>${n}</b></div>`).join("")}</div>`:`<div class="empty">No places added yet.</div>`}
      </section>
      <section class="panel pad">
        <h2 class="st">Latest places</h2>
        ${D.places.length?`<ul class="ll">${D.places.slice(0,6).map(p=>`<li><em>${esc(p.name)}</em><span>${fmtDate(p.created_at)}</span></li>`).join("")}</ul>`:`<div class="empty">Nothing here yet.</div>`}
      </section>
      <section class="panel pad">
        <h2 class="st">Latest reviews</h2>
        ${D.reviews.length?`<ul class="ll">${D.reviews.slice(0,6).map(r=>`<li><em>${esc(r.user_name||"User")} · <span class="stars">${stars(r.rating)}</span></em><span>${esc((byId[String(r.place_key).slice(1)]&&String(r.place_key)[0]==="c")?byId[String(r.place_key).slice(1)].name:"Map place")}</span></li>`).join("")}</ul>`:`<div class="empty">No reviews yet.</div>`}
      </section>
    </div>`}

/* ---------- places ---------- */
function rPlaces(){
  $("#main").innerHTML=`
    <h1 class="pt">Places</h1><p class="sub">Listings added by users. Deleting a place also removes its reviews and photo.</p>
    <div class="bar">
      <input id="pq" type="search" placeholder="Search name, phone or address" value="${esc(F.q)}" aria-label="Search places">
      <select id="pc" aria-label="Category"><option value="">All categories</option>${Object.keys(CATS).map(k=>`<option value="${k}"${F.cat===k?" selected":""}>${catLabel(k)}</option>`).join("")}</select>
      <button class="btn ghost" id="csv" type="button">Export CSV</button>
    </div>
    <div class="panel"><div id="pt"></div></div>`;
  $("#pq").oninput=e=>{F.q=e.target.value;F.lim=100;drawPlaces()};
  $("#pc").onchange=e=>{F.cat=e.target.value;F.lim=100;drawPlaces()};
  $("#csv").onclick=exportCsv;
  drawPlaces()}
const placeList=()=>{
  const q=F.q.trim().toLowerCase();
  return D.places.filter(p=>(!F.cat||p.category===F.cat)&&(!q||[p.name,p.phone,p.address,p.owner_name].some(x=>String(x||"").toLowerCase().includes(q))))};
function drawPlaces(){
  const all=placeList(),list=all.slice(0,F.lim);
  $("#pt").innerHTML=all.length?`
    <div class="scroll"><table>
      <thead><tr><th>Place</th><th>Category</th><th>Added by</th><th>Phone</th><th>Added</th><th></th></tr></thead>
      <tbody>${list.map(p=>`<tr>
        <td><div class="nm">${p.image_url?`<img src="${esc(p.image_url)}" alt="" loading="lazy">`:`<div class="ph">${CATS[p.category]?CATS[p.category][0]:"📍"}</div>`}<div style="min-width:0"><b>${esc(p.name)}</b><small>${esc(p.address||"No address")}</small></div></div></td>
        <td><span class="chip">${catLabel(p.category)}</span></td>
        <td>${esc(p.owner_name||"")}</td>
        <td>${esc(p.phone||"")}</td>
        <td>${fmtDate(p.created_at)}</td>
        <td class="act"><a class="btn ghost sm" href="https://www.google.com/maps?q=${p.lat},${p.lon}" target="_blank" rel="noopener">Map</a><button class="btn ghost sm" data-editp="${p.id}" type="button">Edit</button><button class="btn danger sm" data-delp="${p.id}" type="button">Delete</button></td>
      </tr>`).join("")}</tbody></table></div>
    <div class="more"><span class="count">Showing ${list.length} of ${all.length}</span>${all.length>list.length?` <button class="btn ghost sm" id="mp" type="button" style="margin-left:10px">Show more</button>`:""}</div>`
    :`<div class="empty">${D.places.length?"No places match your search.":"No places have been added yet."}</div>`;
  const mp=$("#mp");if(mp)mp.onclick=()=>{F.lim+=100;drawPlaces()}}
function exportCsv(){
  const rows=[["id","name","category","phone","address","lat","lon","added_by","added"]].concat(placeList().map(p=>[p.id,p.name,p.category,p.phone,p.address,p.lat,p.lon,p.owner_name,p.created_at]));
  const csv=rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="nearby-places.csv";document.body.appendChild(a);a.click();a.remove();toast("CSV downloaded")}

/* ---------- reviews ---------- */
function rReviews(){
  $("#main").innerHTML=`
    <h1 class="pt">Reviews</h1><p class="sub">Ratings and comments from users.</p>
    <div class="bar"><input id="rq" type="search" placeholder="Search user, comment or place" value="${esc(R.q)}" aria-label="Search reviews"></div>
    <div class="panel"><div id="rt"></div></div>`;
  $("#rq").oninput=e=>{R.q=e.target.value;R.lim=100;drawReviews()};
  drawReviews()}
function placeOfKey(k){
  k=String(k);
  if(k[0]==="c"){const p=D.places.find(x=>String(x.id)===k.slice(1));return p?p.name:"Deleted place"}
  const[la,lo]=k.slice(1).split(",");return `Map place (${la}, ${lo})`}
function drawReviews(){
  const q=R.q.trim().toLowerCase();
  const all=D.reviews.filter(r=>!q||[r.user_name,r.comment,placeOfKey(r.place_key)].some(x=>String(x||"").toLowerCase().includes(q))),list=all.slice(0,R.lim);
  $("#rt").innerHTML=all.length?`
    <div class="scroll"><table>
      <thead><tr><th>Place</th><th>User</th><th>Rating</th><th>Comment</th><th>Date</th><th></th></tr></thead>
      <tbody>${list.map(r=>`<tr>
        <td>${esc(placeOfKey(r.place_key))}</td>
        <td>${esc(r.user_name||"User")}</td>
        <td><span class="stars">${stars(r.rating)}</span></td>
        <td class="cm">${esc(r.comment||"")}</td>
        <td>${fmtDate(r.created_at)}</td>
        <td class="act"><button class="btn danger sm" data-delr="${r.id}" type="button">Delete</button></td>
      </tr>`).join("")}</tbody></table></div>
    <div class="more"><span class="count">Showing ${list.length} of ${all.length}</span>${all.length>list.length?` <button class="btn ghost sm" id="mr" type="button" style="margin-left:10px">Show more</button>`:""}</div>`
    :`<div class="empty">${D.reviews.length?"No reviews match your search.":"No reviews yet."}</div>`;
  const mr=$("#mr");if(mr)mr.onclick=()=>{R.lim+=100;drawReviews()}}

/* ---------- map cache ---------- */
async function rCache(){
  $("#main").innerHTML=`
    <h1 class="pt">Map cache</h1><p class="sub">Places from OpenStreetMap that Nearby saved automatically. They refill when people search.</p>
    <div class="panel pad" id="cb"><div class="empty">Loading…</div></div>`;
  const keys=Object.keys(CATS);
  const [total,oldest,newest,...per]=await Promise.all([
    count("osm_places"),
    get("osm_places?select=updated_at&order=updated_at.asc&limit=1"),
    get("osm_places?select=updated_at&order=updated_at.desc&limit=1"),
    ...keys.map(k=>count("osm_places","&category=eq."+k))]);
  if(view!=="cache")return;
  const box=$("#cb");
  if(total==null){box.innerHTML=`<p class="warn">The map cache table was not found. Run the map cache SQL in Supabase first.</p>`;return}
  D.nOsm=total;
  const rows=keys.map((k,i)=>[k,per[i]||0]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1;
  box.innerHTML=`
    <dl class="tot" style="margin-bottom:22px">
      <div><dt>Saved places</dt><dd>${total}</dd></div>
      <div><dt>Oldest</dt><dd style="font-size:18px;line-height:2">${oldest&&oldest[0]?fmtDate(oldest[0].updated_at):"–"}</dd></div>
      <div><dt>Newest</dt><dd style="font-size:18px;line-height:2">${newest&&newest[0]?fmtDate(newest[0].updated_at):"–"}</dd></div>
    </dl>
    ${rows.length?`<h2 class="st">By category</h2><div class="bars" style="margin-bottom:26px">${rows.map(([k,n])=>`<div class="br"><span>${catLabel(k)}</span><i style="width:${Math.max(2,Math.round(n/max*100))}%"></i><b>${n}</b></div>`).join("")}</div>`:""}
    <h2 class="st">Clean up</h2>
    <div class="row2">
      <select id="pd" aria-label="Age"><option value="30">Older than 30 days</option><option value="60" selected>Older than 60 days</option><option value="90">Older than 90 days</option><option value="180">Older than 180 days</option></select>
      <button class="btn ghost" id="pg" type="button">Delete old places</button>
      <button class="btn danger" id="pa" type="button">Clear everything</button>
    </div>
    <p class="note">Clearing the cache is safe. People still see live results from OpenStreetMap, and the cache fills up again as they search.</p>`;
  $("#pg").onclick=()=>{const d=+$("#pd").value;ask("Delete old saved places?",`Saved places not refreshed in the last ${d} days will be removed.`,"Delete",async()=>{const r=await adm("admin_purge_osm",{p_days:d});if(r.error)throw new Error(r.error);toast(`Deleted ${r.deleted||0} places`);rCache()})};
  $("#pa").onclick=()=>ask("Clear the whole map cache?","All saved OpenStreetMap places will be removed. This can't be undone.","Clear everything",async()=>{const r=await adm("admin_purge_osm",{p_days:0});if(r.error)throw new Error(r.error);toast(`Deleted ${r.deleted||0} places`);rCache()})}

/* ---------- edit place ---------- */
let editing=null,eImg=null,eRemove=false;
function toJpeg(file,max=1280){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("Could not read that photo")),"image/jpeg",.82)};img.onerror=()=>rej(new Error("Could not read that photo"));img.src=u})}
function paintPhoto(url){const im=$("#eprev");if(url){im.src=url;im.hidden=false}else{im.removeAttribute("src");im.hidden=true}$("#erm").hidden=!url}
$("#efile").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{eImg=await toJpeg(f);eRemove=false;paintPhoto(URL.createObjectURL(eImg))}catch(x){$("#eerr").textContent=x.message}};
$("#erm").onclick=()=>{eImg=null;eRemove=true;$("#efile").value="";paintPhoto("")};
function editPlace(p){
  editing=p;eImg=null;eRemove=false;$("#efile").value="";paintPhoto(p.image_url||"");
  const d=String(p.detail||""),k=d.indexOf("||");
  editing._meta=k<0?"":d.slice(k);
  const cats=Object.keys(CATS);if(p.category&&!cats.includes(p.category))cats.push(p.category);
  $("#ecat").innerHTML=cats.map(c=>`<option value="${esc(c)}">${catLabel(c)}</option>`).join("");
  $("#ecat").value=p.category||"other";
  $("#ename").value=p.name||"";$("#ephone").value=p.phone||"";$("#edetail").value=k<0?d:d.slice(0,k);
  $("#eaddr").value=p.address||"";$("#elat").value=p.lat;$("#elon").value=p.lon;
  $("#eerr").textContent="";$("#esave").disabled=false;
  $("#edlg").showModal()}
$("#eno").onclick=()=>$("#edlg").close();
$("#ef").onsubmit=async e=>{
  e.preventDefault();
  const p=editing,err=$("#eerr"),b=$("#esave");err.textContent="";if(!p)return;
  const name=$("#ename").value.trim(),lat=parseFloat($("#elat").value),lon=parseFloat($("#elon").value);
  if(!name){err.textContent="Enter a name";return}
  if(!(lat>=-90&&lat<=90)||!(lon>=-180&&lon<=180)){err.textContent="Enter a valid latitude (-90 to 90) and longitude (-180 to 180)";return}
  const v={p_id:+p.id,p_category:$("#ecat").value,p_name:name,p_phone:$("#ephone").value.trim(),p_detail:$("#edetail").value.trim()+p._meta,p_address:$("#eaddr").value.trim(),p_lat:lat,p_lon:lon};
  b.disabled=true;
  try{
    const old=p.image_url||"";let img=old;
    if(eImg){
      const path=`places/${p.user_id||"admin"}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const up=await fetch(`${URL_}/storage/v1/object/media/${path}`,{method:"POST",headers:{apikey:KEY,"Content-Type":"image/jpeg"},body:eImg});
      if(!up.ok)throw new Error("Photo upload failed. Try again.");
      img=`${URL_}/storage/v1/object/public/media/${path}`
    }else if(eRemove)img="";
    v.p_image=img;
    const r=await adm("admin_update_place",v);if(r&&r.error)throw new Error(r.error);
    if(old&&old!==img){const ip=old.split("/object/public/media/")[1];if(ip)fetch(`${URL_}/storage/v1/object/media/${ip}`,{method:"DELETE",headers:{apikey:KEY}}).catch(()=>{})}
    Object.assign(p,{category:v.p_category,name:v.p_name,phone:v.p_phone,detail:v.p_detail,address:v.p_address,lat,lon,image_url:img||null});
    $("#edlg").close();toast("Place updated");if(view==="places")drawPlaces();else show(view)
  }catch(x){err.textContent=/admin_update_place|schema cache|Could not find/i.test(x.message)?"The edit function is not set up in Supabase yet. Run the edit SQL first.":x.message;b.disabled=false}};

/* ---------- delete actions ---------- */
function ask(title,msg,label,fn){
  $("#dt").textContent=title;$("#dm").textContent=msg;$("#dok").textContent=label;
  const d=$("#dlg"),ok=$("#dok");ok.disabled=false;
  ok.onclick=async()=>{ok.disabled=true;try{await fn();d.close()}catch(e){toast(e.message,true);ok.disabled=false}};
  $("#dno").onclick=()=>d.close();d.showModal()}
$("#main").onclick=e=>{
  const dp=e.target.closest("[data-delp]"),dr=e.target.closest("[data-delr]"),ep=e.target.closest("[data-editp]");
  if(ep){const p=D.places.find(x=>String(x.id)===ep.dataset.editp);if(p)editPlace(p);return}
  if(dp){
    const p=D.places.find(x=>String(x.id)===dp.dataset.delp);if(!p)return;
    ask("Delete this place?",`“${p.name}” and its reviews and photo will be removed. This can't be undone.`,"Delete place",async()=>{
      const r=await adm("admin_delete_place",{p_id:+p.id});if(r&&r.error)throw new Error(r.error);
      const ip=(p.image_url||"").split("/object/public/media/")[1];
      if(ip)fetch(`${URL_}/storage/v1/object/media/${ip}`,{method:"DELETE",headers:{apikey:KEY}}).catch(()=>{});
      toast("Place deleted");await loadAll()})}
  if(dr){
    const r0=D.reviews.find(x=>String(x.id)===dr.dataset.delr);if(!r0)return;
    ask("Delete this review?",`The ${r0.rating}-star review by ${r0.user_name||"this user"} will be removed.`,"Delete review",async()=>{
      const r=await adm("admin_delete_review",{p_id:+r0.id});if(r&&r.error)throw new Error(r.error);
      toast("Review deleted");await loadAll()})}};
</script>
